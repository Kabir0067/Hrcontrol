<!DOCTYPE html>
<html lang="tg" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<meta name="color-scheme" content="dark light">
<title>SoftClub · Панели HR</title>
<link rel="stylesheet" href="static/style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234F8DF7'/><text y='68' x='50' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>SC</text></svg>">
<!-- Ҳарду defer: SDK-и Telegram аввал, баъд барнома. Агар SDK нарасад, панел
     ҳамчун сайти оддӣ кор мекунад — ҳеҷ чиз намешиканад. -->
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="static/app.js?v=4"></script>
</head>
<body>

<!-- ══════════════ ВУРУД ══════════════ -->
<section id="login" class="login" hidden>
  <div class="login__box">
    <div class="login__brand">
      <div class="logo">SC</div>
      <h1>SoftClub</h1>
      <p>Панели идоракунии HR</p>
    </div>

    <form id="login-form" class="login__form" autocomplete="off" novalidate>
      <div id="login-error" class="alert alert--danger" hidden></div>

      <label class="field">
        <span class="field__label">Логин</span>
        <input id="in-login" type="text" inputmode="text" autocapitalize="none"
               autocorrect="off" spellcheck="false" placeholder="softclub" required>
      </label>

      <label class="field">
        <span class="field__label">Рамз</span>
        <span class="field__wrap">
          <input id="in-pass" type="password" placeholder="••••" required>
          <button type="button" class="field__eye" id="toggle-pass" aria-label="Нишон додани рамз">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>

      <button type="submit" class="btn btn--primary btn--block" id="login-btn">
        <span>Даромадан</span>
      </button>
    </form>

    <p class="login__foot" id="login-foot">SoftClub HR Control</p>
  </div>
</section>


<!-- ══════════════ БАРНОМА ══════════════ -->
<div id="app" class="app" hidden>

  <header class="appbar">
    <div class="appbar__row">
      <div class="appbar__brand">
        <div class="logo logo--sm">SC</div>
        <div>
          <strong id="view-title">Хулоса</strong>
          <small id="view-sub">SoftClub HR</small>
        </div>
      </div>

      <div class="appbar__actions">
        <button class="iconbtn" id="btn-theme" aria-label="Мавзӯъ">
          <svg viewBox="0 0 24 24" class="ico-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg viewBox="0 0 24 24" class="ico-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="iconbtn" id="btn-refresh" aria-label="Навсозӣ">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="iconbtn iconbtn--danger" id="btn-logout" aria-label="Баромадан">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>

    <nav class="pills" id="pills">
      <button class="pill is-active" data-view="home">Хулоса</button>
      <button class="pill" data-view="req">Дархостҳо</button>
      <button class="pill" data-view="team">Кормандон</button>
      <button class="pill" data-view="charts">Графикҳо</button>
    </nav>
  </header>

  <main class="main">

    <!-- ─────── ХУЛОСА ─────── -->
    <section class="view is-active" id="view-home">
      <div class="stats" id="home-stats">
        <div class="stat skeleton"></div><div class="stat skeleton"></div>
        <div class="stat skeleton"></div><div class="stat skeleton"></div>
      </div>

      <div class="card">
        <div class="card__head">
          <h2>Ҳафтаи охир</h2>
          <span class="card__note" id="week-note">—</span>
        </div>
        <div class="card__body" id="chart-week"></div>
      </div>

      <div class="card">
        <div class="card__head">
          <h2>Дархостҳои охирин</h2>
          <button class="linkbtn" data-goto="req">Ҳама ›</button>
        </div>
        <div class="list" id="home-recent"></div>
      </div>
    </section>

    <!-- ─────── ДАРХОСТҲО ─────── -->
    <section class="view" id="view-req">
      <div class="searchbar">
        <svg viewBox="0 0 24 24" class="searchbar__ico"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="f-q" type="search" placeholder="Ном ё сабабро ҷустуҷӯ кунед…" autocomplete="off">
        <button class="searchbar__filter" id="btn-filters" aria-label="Филтрҳо">
          <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
          <span class="dot" id="filter-dot" hidden></span>
        </button>
      </div>

      <div class="filters" id="filters" hidden>
        <div class="filters__grid">
          <label class="field field--sm">
            <span class="field__label">Навъ</span>
            <select id="f-type">
              <option value="">Ҳама навъҳо</option>
              <option value="late">Дер мекунад</option>
              <option value="absent">Намеояд</option>
              <option value="at_work_waiting">Ҷавоб мепурсад</option>
              <option value="leaving_early">Барвақт меравад</option>
            </select>
          </label>
          <label class="field field--sm">
            <span class="field__label">Вазъият</span>
            <select id="f-status">
              <option value="">Ҳама вазъиятҳо</option>
              <option value="pending">Дар интизорӣ</option>
              <option value="accepted">Қабул</option>
              <option value="rejected">Рад</option>
              <option value="cancelled">Бекор</option>
            </select>
          </label>
          <label class="field field--sm">
            <span class="field__label">Аз сана</span>
            <input id="f-from" type="date">
          </label>
          <label class="field field--sm">
            <span class="field__label">То сана</span>
            <input id="f-to" type="date">
          </label>
        </div>
        <div class="filters__foot">
          <button class="btn btn--ghost btn--sm" id="btn-reset">Тоза кардан</button>
          <button class="btn btn--ghost btn--sm" id="btn-export">⬇ CSV</button>
        </div>
      </div>

      <div class="list list--cards" id="req-list"></div>
      <button class="btn btn--ghost btn--block" id="btn-more" hidden>Боз нишон диҳед</button>
    </section>

    <!-- ─────── КОРМАНДОН ─────── -->
    <section class="view" id="view-team">
      <div class="team" id="team-list"></div>
    </section>

    <!-- ─────── ГРАФИКҲО ─────── -->
    <section class="view" id="view-charts">
      <div class="card">
        <div class="card__head"><h2>Аз рӯи навъ</h2></div>
        <div class="card__body" id="chart-type"></div>
      </div>
      <div class="card">
        <div class="card__head"><h2>Аз рӯи вазъият</h2></div>
        <div class="card__body" id="chart-status"></div>
      </div>
      <div class="card">
        <div class="card__head">
          <h2>14 рӯзи охир</h2>
          <span class="card__note" id="trend-note">—</span>
        </div>
        <div class="card__body" id="chart-trend"></div>
      </div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Хулоса</span>
    </button>
    <button class="tab" data-view="req">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>Дархостҳо</span>
    </button>
    <button class="tab" data-view="team">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 20a6.4 6.4 0 0 0-2-4.6"/></svg>
      <span>Кормандон</span>
    </button>
    <button class="tab" data-view="charts">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Графикҳо</span>
    </button>
  </nav>
</div>


<!-- ══════════════ ПАНЕЛИ ТАФСИЛОТ ══════════════ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__grip" data-close></div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

</body>
</html>
