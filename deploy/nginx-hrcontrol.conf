# ═══════════════════════════════════════════════════════════════════
#  SoftClub HR Control — test.softclub.tj
#  Нусхаи эталонӣ: агар /etc/nginx/sites-available/hrcontrol нест шавад,
#  hrcontrol-watchdog онро аз ҳамин файл барқарор мекунад.
#  Backend: main.py → 127.0.0.1:8901 (systemd: hrcontrol.service)
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name test.softclub.tj;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.softclub.tj;

    ssl_certificate     /etc/letsencrypt/live/test.softclub.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.softclub.tj/privkey.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/csv;
    gzip_min_length 512;

    # Панели HR (Telegram Mini App ва браузер)
    location /hrcontrol/ {
        proxy_pass http://127.0.0.1:8901/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /hrcontrol { return 301 /hrcontrol/; }

    # Дар айни замон дар ин домен чизи дигаре нест
    location / { return 302 /hrcontrol/; }
}
