# ═══════════════════════════════════════════════════════════════════
#  SoftClub HR Control — staff.softclub.tj (панел ва Mini App дар решаи домен)
#  Backend: main.py → 127.0.0.1:8901 (systemd: hrcontrol.service)
#
#  То гирифтани сертификат 443 бо сертификати муваққатии snakeoil кор мекунад
#  (барои Cloudflare «Full»). Watchdog вақте DNS ба сервер ишора кунад,
#  certbot-ро худаш иҷро мекунад ва WEBAPP_URL-ро ба https://staff.softclub.tj/ мегузаронад.
# ═══════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name staff.softclub.tj;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staff.softclub.tj;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    gzip_min_length 512;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8901/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
